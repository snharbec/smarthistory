[package]
name = "smarthistory"
version = "2.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
arboard = "3"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
plist = "1"
ratatui = "0.30.0"
ratatui-themes = "0.2"
regex = "1.10"
rusqlite = "0.38.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
# Pin `time` to <0.3.52 because `time 0.3.52` changed the
# `Parsing::parse` signature from 1-arg to 2-arg, but
# `cookie 0.18.1` (transitive via `reqwest` → `note_search` →
# `cookie_store`) still calls the old 1-arg form, producing
# `error[E0061]: this method takes 2 arguments but 1
# argument was supplied` at the build of `cookie`.
time = "=0.3.51"
note_search = { git = "https://github.com/snharbec/note_search.git" }
# Cross-platform file watching for the `smarthistory daemon`
# (FSEvents on macOS, inotify on Linux). The 4.x line keeps the
# `DebouncedEvent` API, whose debounce window coalesces the burst
# of events from a single editor save into one event — exactly
# what time tracking wants (one "file saved in project X", not
# 50 raw events). notify 5.x/6.x/7.x replaced `DebouncedEvent` with
# a raw `Event` stream that has no built-in debounce, so we pin
# the 4.x line.
notify = "4"
# `reqwest` is ALSO a transitive dep of `note_search`
# (it uses `reqwest` for its JIRA import feature). Adding
# it directly here reuses the SAME already-compiled
# crate (cargo unifies features), so it costs no extra
# binary weight, while letting the TUI do live JIRA
# search via the `-` prefix. We need `blocking` + `json`
# + `gzip`: the JIRA REST v2 search endpoint gzips any
# response larger than a single issue (project-wide
# queries, multi-page results), and `gzip` is NOT in
# `reqwest`'s `default` feature set, so we have to enable
# it explicitly. Without it, the blocking client fails
# with "error decoding response body" on any gzipped
# reply — a single-issue `key = X-1` worked only because
# that one tiny response wasn't gzipped. The union with
# `note_search`'s feature set is still the same compiled
# crate; we just turn on one extra feature.
reqwest = { version = "0.12", features = [
  "blocking",
  "json",
  "gzip",
  "native-tls",
] }
ureq = { version = "2", features = ["json"] }
# In-process syntax highlighting for `tui.highlight` (the TUI's
# command-list coloring) — the same engine `bat` itself is built on,
# used here directly instead of shelling out to the `bat` binary.
# `default-features = false` + `default-fancy` explicitly selects the
# pure-Rust `fancy-regex` backend over syntect's default `onig`
# (Oniguruma, a C library) — this project cross-compiles release
# binaries for macOS x86_64/arm64 and Linux x86_64 (see
# `.github/workflows/release.yml`), and pulling in a C regex engine
# would add a toolchain requirement to every one of those targets for
# no benefit `fancy-regex` doesn't already cover for the small,
# single-line shell-command strings this highlights.
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
# HTTP server for `smarthistory serve` (the time-tracking web
# dashboard). `axum`/`tokio` are ALSO transitive deps of
# `note_search` (its own JIRA-import feature uses `reqwest`, which
# pulls in `hyper`/`tokio`; `axum` itself comes in via `note_search`'s
# own dependency graph) — adding them directly here reuses the SAME
# already-compiled crates (cargo unifies versions/features), so this
# costs no extra binary weight in practice. `tokio`'s feature set is
# scoped to just what a single blocking `Runtime::new().block_on(...)`
# call needs — the rest of the CLI stays fully synchronous; only the
# `serve` subcommand ever touches async.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

# Feature flag for the
# alternative `herdr`
# multiplexer backend.
#
# herdr (https://herdr.dev)
# is a terminal workspace
# manager that plays a
# role similar to tmux
# for AI-agent workflows.
# When this feature is
# enabled, the TUI's
# directory-switching
# logic (`#` mode) and
# panes-switching logic
# (`*` mode) can target
# herdr workspaces in
# addition to tmux
# sessions. The user
# selects the active
# backend at runtime
# via `multiplexer=tmux|herdr`
# in
# `~/.config/smarthistory/config`
# (or the
# `SMARTHISTORY_MULTIPLEXER`
# environment variable).
#
# **Enabled by default**
# so a fresh
# `cargo build --release`
# (or `cargo install`)
# produces a binary that
# can target either
# backend without
# extra flags. The
# feature exists for
# users who want to
# build a smaller
# tmux-only binary
# (`cargo build
# --no-default-features`
# keeps the binary
# working but disables
# the herdr backend
# entirely; selecting
# `multiplexer=herdr`
# on such a build
# surfaces a clear
# "build with default
# features" status
# message at the
# staging site).
[features]
default = ["herdr"]
herdr = []

[dev-dependencies]
filetime = "0.2"
