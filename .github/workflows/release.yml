name: Release

# Triggered by pushing a tag like `v1.2.0`. Builds a release binary
# natively on macOS (Apple Silicon + Intel) and Linux (x86_64) --
# native runners, not cross-compilation, since `reqwest`'s
# `native-tls` feature links the target platform's own OpenSSL/
# Secure Transport and is painful to cross-compile for. Each build
# runs the test suite first, then packages and uploads the binary as
# a release asset.
#
# The Linux target triple (x86_64-unknown-linux-gnu) is built twice,
# once on ubuntu-latest and once on ubuntu-22.04: `ubuntu-latest`
# tracks GitHub's rolling default (currently 24.04, glibc 2.39), so a
# binary built there won't run on an older distro whose glibc predates
# that — glibc is forward- but not backward-compatible. The 22.04
# build (glibc 2.35) is the broad-compatibility artifact for users on
# older/more conservative distros; both are uploaded as separate,
# distinctly-named release assets (`matrix.artifact`, not
# `matrix.target` -- the two Linux jobs share a target triple but must
# not share an asset filename).
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: x86_64-unknown-linux-gnu-ubuntu22.04

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: Run tests
        run: cargo test --verbose --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/smarthistory
          strip "$bin"
          staging="smarthistory-${{ matrix.artifact }}"
          mkdir -p "$staging"
          cp "$bin" "$staging/"
          cp README.md LICENSE "$staging/" 2>/dev/null || true
          archive="${staging}.tar.gz"
          tar -czf "$archive" "$staging"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" > "${archive}.sha256"
          else
            sha256sum "$archive" > "${archive}.sha256"
          fi
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
